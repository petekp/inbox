<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparison</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f4f5f7;
        --surface: #ffffff;
        --ink: #1a1c21;
        --muted: #5b616c;
        --rule: #dcdfe5;
        --code: #eceef2;
        --pick: #243bf5;
        --tag: #243bf5;
        --on-tag: #ffffff;
        --band: color-mix(in srgb, var(--pick) 6%, var(--page));
        --best: #25652f;
        --odd: #745417;
        --error: #a5293d;
        --error-tint: #fbe9ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #131418;
          --surface: #1b1d22;
          --ink: #e8e9ed;
          --muted: #a3a9b4;
          --rule: #2e3139;
          --code: #15171b;
          --pick: #8f9cff;
          --tag: #4b63ff;
          --on-tag: #ffffff;
          --band: color-mix(in srgb, var(--pick) 9%, var(--page));
          --best: #7ecd8f;
          --odd: #ffc107;
          --error: #ffa3b0;
          --error-tint: #3a1d23;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-text-size-adjust: 100%;
      }
      main {
        container: page / inline-size;
        max-width: 76rem;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }
      @media (min-width: 720px) {
        main {
          padding: 40px 32px 64px;
        }
      }
      h1,
      h2,
      h3,
      p,
      ul,
      figure {
        margin: 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .tag {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 5px;
        background: var(--tag);
        color: var(--on-tag);
        font-size: 12px;
        font-weight: 700;
        line-height: 16px;
        letter-spacing: 0.01em;
        vertical-align: 2px;
        white-space: nowrap;
      }

      .verdict {
        max-width: 44rem;
      }
      .question {
        color: var(--muted);
        font-size: 16px;
        font-weight: 550;
        line-height: 1.4;
      }
      .pick {
        margin-top: 10px;
        font-size: clamp(26px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.012em;
        overflow-wrap: anywhere;
      }
      .pick .tag {
        margin-left: 12px;
        padding: 4px 11px;
        border-radius: 7px;
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 0;
        vertical-align: 0.3em;
      }
      .pick.is-missing {
        color: var(--muted);
      }
      .change {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .reason {
        margin-top: 14px;
        font-size: 17px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .odd {
        margin-top: 18px;
        padding-left: 12px;
        border-left: 3px solid var(--odd);
        overflow-wrap: anywhere;
      }
      .odd strong {
        color: var(--odd);
      }
      .problems {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--error-tint);
        color: var(--error);
        font-size: 14px;
      }
      .problems ul {
        padding-left: 18px;
      }

      .better {
        color: var(--muted);
        font-weight: 400;
        white-space: nowrap;
      }
      .value {
        position: relative;
        font-size: 15px;
        line-height: 1.4;
      }
      .value.is-best {
        color: var(--best);
        font-weight: 650;
      }
      .value.is-best::before {
        content: '✓';
        position: absolute;
        left: -16px;
      }
      .value.is-empty {
        color: var(--muted);
        font-style: italic;
      }
      .note {
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .summary {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }
      .tally {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .pips {
        display: inline-flex;
        gap: 3px;
      }
      .pips i {
        width: 8px;
        height: 8px;
        border: 1.5px solid var(--rule);
        border-radius: 2px;
      }
      .pips i.won {
        border-color: var(--best);
        background: var(--best);
      }

      .matrix {
        display: none;
        margin: 32px -18px 0;
        overflow-wrap: anywhere;
      }
      .band {
        border-radius: 10px 10px 0 0;
        background: var(--band);
      }
      .col-name {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 14px 18px 8px;
        background: var(--page);
        font-size: 17px;
        font-weight: 650;
        line-height: 1.3;
      }
      .col-name.is-pick {
        padding-top: 11px;
        border-top: 3px solid var(--pick);
        border-radius: 10px 10px 0 0;
        background: var(--band);
      }
      .matrix.is-stuck .col-name {
        box-shadow: 0 1px 0 var(--rule);
      }
      .stuck-mark {
        align-self: start;
        height: 1px;
      }
      .col-summary {
        padding: 0 18px 6px;
      }
      .col-summary .summary {
        margin-top: 0;
      }
      .col-tally {
        padding: 2px 18px 14px;
      }
      .m-head {
        padding: 14px 18px 4px;
        border-top: 1px solid var(--rule);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }
      .cell {
        padding: 2px 18px 14px;
      }

      .cards {
        display: grid;
        gap: 16px;
        margin-top: 28px;
      }
      .card {
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--surface);
        overflow-wrap: anywhere;
      }
      .card.is-pick {
        border: 2px solid var(--pick);
      }
      .card > * {
        padding: 10px 22px;
      }
      .card.is-pick > * {
        padding-inline: 21px;
      }
      .card-head {
        padding-top: 14px;
        padding-bottom: 12px;
      }
      .card-head h2 {
        font-size: 17px;
        font-weight: 650;
        line-height: 1.3;
      }
      .card-head .tally {
        margin-top: 8px;
      }
      .row {
        border-top: 1px solid var(--rule);
      }
      .label {
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }

      .previews {
        margin-top: 40px;
      }
      .preview-group + .preview-group {
        margin-top: 32px;
      }
      .preview-group h2 {
        font-size: 16px;
        font-weight: 650;
      }
      .preview-group > p {
        max-width: 44rem;
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--cols) * 1ch + 30px)), 1fr));
        gap: 16px;
        margin-top: 12px;
        font:
          12.5px/1.4 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      .preview figcaption {
        margin-bottom: 6px;
        font:
          600 14px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      .preview pre {
        margin: 0;
        padding: 12px 14px;
        overflow-x: auto;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--code);
        font: inherit;
        tab-size: 4;
      }
      .preview.is-pick pre {
        border-color: var(--pick);
      }
      @media (max-width: 400px) {
        .preview pre {
          padding: 10px 11px;
        }
      }

      .folds {
        max-width: 44rem;
        margin-top: 36px;
      }
      details {
        border-top: 1px solid var(--rule);
      }
      details:last-child {
        border-bottom: 1px solid var(--rule);
      }
      summary {
        padding: 12px 0;
        cursor: pointer;
        font-weight: 600;
      }
      summary::marker {
        color: var(--muted);
      }
      summary:focus-visible {
        outline: 2px solid var(--pick);
        outline-offset: 2px;
        border-radius: 4px;
      }
      summary .count {
        margin-left: 6px;
        color: var(--muted);
        font-weight: 400;
      }
      details > ul,
      details > p {
        padding-bottom: 14px;
        overflow-wrap: anywhere;
      }
      details > ul {
        padding-left: 20px;
      }
      details li + li,
      details p + p {
        margin-top: 8px;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const page = document.getElementById('page')
        const holder = document.getElementById('compare-data')
        const raw = (holder ? holder.textContent : '').trim()
        const COLUMN_MIN_PX = 184

        function h(tag, props, ...kids) {
          const el = document.createElement(tag)
          for (const [name, value] of Object.entries(props || {})) {
            if (value === null || value === undefined || value === false) continue
            el.setAttribute(name, value === true ? '' : String(value))
          }
          for (const kid of kids.flat(Infinity)) {
            if (kid === null || kid === undefined || kid === false || kid === '') continue
            el.append(kid instanceof Node ? kid : String(kid))
          }
          return el
        }
        const text = v => (typeof v === 'string' ? v.trim() : typeof v === 'number' ? String(v) : '')
        const list = v => (Array.isArray(v) ? v : v === null || v === undefined || v === '' ? [] : [v])
        const keyOf = name => text(name).toLowerCase().replace(/\s+/g, ' ')

        function fail(message) {
          page.replaceChildren(h('p', { class: 'problems' }, message))
        }
        if (!raw) return fail('This page has no comparison data. Add it as JSON after the last line of this file.')
        let data
        try {
          data = JSON.parse(raw)
        } catch (e) {
          return fail(`The comparison data is not valid JSON: ${e.message}`)
        }
        if (!data || typeof data !== 'object') return fail('The comparison data is not a JSON object.')

        const problems = []
        const measures = list(data.measures).filter(m => m && typeof m === 'object')
        const previews = list(data.previews).filter(p => p && typeof p === 'object')
        let choices = list(data.choices)
          .map(c => (typeof c === 'string' ? { name: c } : c && typeof c === 'object' ? c : {}))
          .map(c => ({ name: text(c.name), summary: text(c.summary) }))
          .filter(c => c.name)
        if (choices.length === 0) {
          problems.push('The data lists no choices.')
          const seen = new Map()
          for (const m of measures)
            for (const name of Object.keys(m.values || {})) if (!seen.has(keyOf(name))) seen.set(keyOf(name), name)
          choices = [...seen.values()].map(name => ({ name: text(name), summary: '' }))
        }
        const byKey = new Map(choices.map(c => [keyOf(c.name), c]))
        function choiceNamed(name, where) {
          const choice = byKey.get(keyOf(name))
          if (!choice && text(name)) problems.push(`“${text(name)}”, ${where}, is not one of the choices.`)
          return choice
        }

        const question = text(data.question)
        const pick = text(data.pick) ? choiceNamed(data.pick, 'the pick') : undefined
        const pickName = pick ? pick.name : text(data.pick)
        const before = text(data.pickBefore)
        const isSamePick = before && keyOf(before) === keyOf(pickName)
        const isPick = choice => keyOf(choice.name) === keyOf(pickName)
        document.title = question || 'Comparison'

        const measureName = (m, i) => text(m.name) || `Measure ${i + 1}`
        const bestSets = measures.map((m, i) => {
          const where = `named as best on “${measureName(m, i)}”`
          return new Set(
            list(m.best)
              .map(name => choiceNamed(name, where))
              .filter(Boolean)
              .map(c => keyOf(c.name)),
          )
        })
        measures.forEach((m, i) => {
          for (const name of Object.keys(m.values || {}))
            choiceNamed(name, `named in the values of “${measureName(m, i)}”`)
        })
        previews.forEach((p, i) => {
          for (const name of Object.keys(p.texts || {}))
            choiceNamed(name, `named in the preview “${text(p.title) || i + 1}”`)
        })
        const judgedSets = bestSets.filter(s => s.size > 0)

        const tag = () => h('span', { class: 'tag' }, 'Pick')
        const better = m => text(m.better) && h('span', { class: 'better' }, ` (${text(m.better)})`)
        function tally(choice) {
          if (judgedSets.length === 0) return null
          const won = judgedSets.filter(s => s.has(keyOf(choice.name))).length
          return h(
            'p',
            { class: 'tally' },
            `Best on ${won} of ${judgedSets.length} measures`,
            h(
              'span',
              { class: 'pips', 'aria-hidden': 'true' },
              judgedSets.map(s => h('i', { class: s.has(keyOf(choice.name)) ? 'won' : null })),
            ),
          )
        }
        function result(m, i, choice) {
          const entry = Object.entries(m.values || {}).find(([name]) => keyOf(name) === keyOf(choice.name))
          const raw = entry ? entry[1] : undefined
          const isObject = raw && typeof raw === 'object'
          const value = isObject ? text(raw.value) : text(raw)
          const note = isObject ? text(raw.note) : ''
          const isBest = bestSets[i].has(keyOf(choice.name))
          return [
            value
              ? h(
                  'p',
                  { class: isBest ? 'value is-best' : 'value' },
                  value,
                  isBest && h('span', { class: 'sr' }, ' (best)'),
                )
              : h('p', { class: 'value is-empty' }, 'Not measured'),
            note && h('p', { class: 'note' }, note),
          ]
        }

        const verdict = h(
          'header',
          { class: 'verdict' },
          question && h('h1', { class: 'question' }, question),
          pickName ? h('p', { class: 'pick' }, pickName, tag()) : h('p', { class: 'pick is-missing' }, 'No pick'),
          before &&
            pickName &&
            h(
              'p',
              { class: 'change' },
              isSamePick ? 'Same pick as before the comparison.' : `Before the comparison, the pick was ${before}.`,
            ),
          text(data.reason) && h('p', { class: 'reason' }, text(data.reason)),
          text(data.unexpected) && h('p', { class: 'odd' }, h('strong', null, 'Unexpected: '), text(data.unexpected)),
        )

        const headRows = 3
        const stuckMark = h('div', { class: 'stuck-mark', style: 'grid-column: 1; grid-row: 1', 'aria-hidden': 'true' })
        const pickColumn = choices.findIndex(isPick) + 1
        const matrix = h(
          'section',
          {
            class: 'matrix',
            'aria-label': 'Choices',
            style: `grid-template-columns: repeat(${choices.length}, minmax(0, 1fr)); grid-template-rows: repeat(${headRows + 2 * measures.length}, auto)`,
          },
          pickColumn > 0 && h('div', { class: 'band', style: `grid-column: ${pickColumn}; grid-row: 1 / -1` }),
          stuckMark,
          choices.map((choice, c) => [
            h(
              'h2',
              { class: isPick(choice) ? 'col-name is-pick' : 'col-name', style: `grid-column: ${c + 1}; grid-row: 1` },
              choice.name,
              isPick(choice) && tag(),
            ),
            h(
              'div',
              { class: 'col-summary', style: `grid-column: ${c + 1}; grid-row: 2` },
              choice.summary && h('p', { class: 'summary' }, choice.summary),
            ),
            h('div', { class: 'col-tally', style: `grid-column: ${c + 1}; grid-row: 3` }, tally(choice)),
          ]),
          measures.map((m, i) => [
            h(
              'h3',
              { class: 'm-head', style: `grid-column: 1 / -1; grid-row: ${headRows + 1 + 2 * i}` },
              measureName(m, i),
              better(m),
            ),
            choices.map((choice, c) =>
              h(
                'div',
                { class: 'cell', style: `grid-column: ${c + 1}; grid-row: ${headRows + 2 + 2 * i}` },
                h('span', { class: 'sr' }, `${choice.name}: `),
                result(m, i, choice),
              ),
            ),
          ]),
        )
        const columnsFit = h(
          'style',
          null,
          `@container page (min-width: ${choices.length * COLUMN_MIN_PX}px) {
            .matrix { display: grid; }
            .cards { display: none; }
          }`,
        )

        const cards = h(
          'section',
          { class: 'cards', 'aria-label': 'Choices' },
          choices.map(choice =>
            h(
              'article',
              { class: isPick(choice) ? 'card is-pick' : 'card' },
              h(
                'div',
                { class: 'card-head' },
                h('h2', null, choice.name, isPick(choice) && tag()),
                choice.summary && h('p', { class: 'summary' }, choice.summary),
                tally(choice),
              ),
              measures.map((m, i) =>
                h(
                  'div',
                  { class: 'row' },
                  h('p', { class: 'label' }, measureName(m, i), better(m)),
                  result(m, i, choice),
                ),
              ),
            ),
          ),
        )

        const previewSection =
          previews.length > 0 &&
          h(
            'section',
            { class: 'previews', 'aria-label': 'Previews' },
            previews.map(p => {
              const blocks = choices
                .map(choice => {
                  const entry = Object.entries(p.texts || {}).find(([name]) => keyOf(name) === keyOf(choice.name))
                  return entry && typeof entry[1] === 'string' ? { choice, body: entry[1].replace(/\s+$/, '') } : null
                })
                .filter(Boolean)
              const widest = Math.max(20, ...blocks.flatMap(b => b.body.split('\n').map(line => line.length)))
              return h(
                'div',
                { class: 'preview-group' },
                h('h2', null, text(p.title) || 'Preview'),
                text(p.note) && h('p', null, text(p.note)),
                h(
                  'div',
                  { class: 'preview-grid', style: `--cols: ${Math.min(widest, 100)}` },
                  blocks.map(b =>
                    h(
                      'figure',
                      { class: isPick(b.choice) ? 'preview is-pick' : 'preview' },
                      h('figcaption', null, b.choice.name, isPick(b.choice) && tag()),
                      h('pre', null, b.body),
                    ),
                  ),
                ),
              )
            }),
          )

        const caveats = list(data.caveats).map(text).filter(Boolean)
        const method = list(data.method).map(text).filter(Boolean)
        const folds =
          (caveats.length > 0 || method.length > 0) &&
          h(
            'section',
            { class: 'folds' },
            caveats.length > 0 &&
              h(
                'details',
                null,
                h('summary', null, 'Caveats', h('span', { class: 'count' }, caveats.length)),
                h(
                  'ul',
                  null,
                  caveats.map(c => h('li', null, c)),
                ),
              ),
            method.length > 0 &&
              h(
                'details',
                null,
                h('summary', null, 'How the choices were compared'),
                method.map(p => h('p', null, p)),
              ),
          )

        const problemNote =
          problems.length > 0 &&
          h(
            'div',
            { class: 'problems', role: 'note' },
            h('p', null, 'Problems in the comparison data:'),
            h(
              'ul',
              null,
              problems.map(p => h('li', null, p)),
            ),
          )

        document.head.append(columnsFit)
        new IntersectionObserver(([entry]) => {
          matrix.classList.toggle('is-stuck', !entry.isIntersecting && entry.boundingClientRect.top < 0)
        }).observe(stuckMark)
        page.replaceChildren(verdict, problemNote || '', matrix, cards, previewSection || '', folds || '')
      })
    </script>
  </head>
  <body>
    <main id="page">
      <noscript>This page needs JavaScript to draw the comparison.</noscript>
    </main>
    <plaintext id="compare-data" hidden>
