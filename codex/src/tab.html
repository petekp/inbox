<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        --line: var(--color-border-default, rgba(0, 0, 0, 0.12));
        --card: var(--color-background-secondary, rgba(0, 0, 0, 0.035));
        --key: #243bf5;
        --needs-you: #745417;
        --findings: #7b00e8;
        --done: #25652f;
        --error: #a5293d;
        --error-mark: #a5293d;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: var(--color-background-primary, #1e1e1e);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #bdbdbd);
          --line: var(--color-border-default, rgba(255, 255, 255, 0.12));
          --card: var(--color-background-secondary, rgba(255, 255, 255, 0.045));
          --key: #b1b9f9;
          --needs-you: #ffc107;
          --findings: #cab0ff;
          --done: #7ecd8f;
          --error: #ffa3b0;
          --error-mark: #ff6b80;
        }
      }
      :root[data-theme='dark'] {
        --key: #b1b9f9;
        --needs-you: #ffc107;
        --findings: #cab0ff;
        --done: #7ecd8f;
        --error: #ffa3b0;
        --error-mark: #ff6b80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 var(--font-sans, system-ui, sans-serif);
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .mark-error {
        color: var(--error-mark);
      }
      .notice {
        padding: 8px 16px;
        color: var(--error);
      }
      header {
        padding: 12px 16px 4px;
      }
      .goal {
        font-weight: 600;
      }
      .goal-mark {
        color: var(--muted);
        margin-right: 6px;
      }
      .card-line {
        padding-left: 18px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        gap: 16px;
      }
      .tab {
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        color: var(--muted);
      }
      .tab.shown {
        color: var(--text);
        font-weight: 600;
      }
      .tab.shown.needsYou {
        border-color: var(--needs-you);
      }
      .tab.shown.findings {
        border-color: var(--findings);
      }
      .status {
        padding: 6px 0;
        color: var(--muted);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 12px 8px;
      }
      section {
        background: var(--card);
        border-radius: 8px;
        padding: 8px 0;
      }
      .group-title {
        padding: 2px 12px 6px;
        font-weight: 600;
      }
      .group-title .count {
        font-weight: normal;
        color: var(--muted);
        margin-left: 6px;
      }
      .entry + .entry {
        border-top: 1px solid var(--line);
      }
      .row {
        display: flex;
        gap: 8px;
        padding: 6px 12px 6px 9px;
        border-left: 3px solid transparent;
      }
      .row.selected {
        border-left-color: var(--key);
        background: color-mix(in srgb, var(--key) 12%, transparent);
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .handle {
        flex: none;
        width: 22px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .handle.tone-done {
        color: var(--done);
      }
      .handle.mark-error {
        color: var(--error-mark);
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .line {
        display: flex;
        gap: 0;
        width: 100%;
        min-width: 0;
      }
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .text.two {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        flex: none;
        white-space: pre;
        color: var(--muted);
      }
      .line .after.tone-done {
        color: var(--done);
      }
      .line:hover .text {
        text-decoration: underline;
        text-decoration-color: var(--line);
      }
      .title {
        font-weight: 600;
      }
      .title .after {
        font-weight: normal;
        color: var(--muted);
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0 0 4px;
      }
      .failure {
        font: 12px var(--font-mono, ui-monospace, monospace);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .command {
        font: 12px var(--font-mono, ui-monospace, monospace);
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
      }
      .key {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        background: var(--bg);
      }
      .key:hover {
        border-color: var(--muted);
      }
      .key.primary {
        border-color: var(--needs-you);
      }
      .key kbd {
        font: inherit;
        color: var(--key);
        margin-right: 6px;
      }
      .key-dot {
        color: var(--muted);
        padding: 0 2px;
      }
      form {
        display: flex;
        gap: 6px;
      }
      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
      }
      form button {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        background: var(--bg);
      }
      textarea {
        width: 100%;
        font: 12px var(--font-mono, ui-monospace, monospace);
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .empty-line {
        padding: 2px 12px 4px 42px;
        color: var(--muted);
      }
      .fold {
        padding: 6px 12px 2px 42px;
        color: var(--muted);
      }
      .closed {
        display: flex;
        gap: 8px;
        padding: 4px 12px 4px 42px;
      }
      .closed .ask {
        color: var(--muted);
      }
      .closed .outcome {
        font-weight: 600;
      }
      .closed .outcome.lapsed {
        font-weight: normal;
        color: var(--muted);
      }
      .settled .what {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leave {
        width: 96px;
        height: 2px;
        margin-top: 4px;
      }
      .leave div {
        height: 100%;
        background: var(--done);
        animation-name: leave;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes leave {
        from {
          width: 100%;
        }
        to {
          width: 0;
        }
      }
      .empty {
        padding: 48px 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 6px;
      }
      footer {
        padding: 4px 16px 16px;
        color: var(--muted);
      }
      footer kbd {
        font: inherit;
        color: var(--key);
      }
    </style>
  </head>
  <body>
    <div id="app" class="notice muted">Loading…</div>
    <script>
      /*TAB_SCRIPT*/
    </script>
  </body>
</html>
