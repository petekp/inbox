<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      :root {
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #6b6b6b);
        --line: var(--color-border-default, rgba(0, 0, 0, 0.12));
        --button: var(--color-background-secondary, rgba(0, 0, 0, 0.05));
        --accent: #8a5a00;
        --done: #25652f;
        --error: #a5293d;
        --findings: #7b00e8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: var(--color-background-primary, #1e1e1e);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #9a9a9a);
          --line: var(--color-border-default, rgba(255, 255, 255, 0.12));
          --button: var(--color-background-secondary, rgba(255, 255, 255, 0.07));
          --accent: #ffc107;
          --done: #7ecd8f;
          --error: #ffa3b0;
          --findings: #cab0ff;
        }
      }
      :root[data-theme='dark'] {
        --accent: #ffc107;
        --done: #7ecd8f;
        --error: #ffa3b0;
        --findings: #cab0ff;
      }
      body {
        margin: 0;
        padding: 12px 16px 24px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 var(--font-sans, system-ui, sans-serif);
      }
      h2 {
        margin: 20px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .goal {
        font-size: 14px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        margin-top: 4px;
        color: var(--muted);
      }
      .waiting {
        color: var(--accent);
        font-weight: 600;
      }
      .row {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }
      .ask {
        font-weight: 500;
      }
      .detail {
        margin-top: 2px;
        white-space: pre-wrap;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--button);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 3px 9px;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: var(--muted);
        text-decoration: underline;
      }
      .last {
        margin-top: 6px;
        color: var(--muted);
      }
      .ok {
        color: var(--done);
      }
      .error {
        color: var(--error);
      }
      .badge-issue {
        color: var(--accent);
      }
      .badge-opportunity {
        color: var(--findings);
      }
      form {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 3px 8px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        font: 12px var(--font-mono, ui-monospace, monospace);
        color: inherit;
        background: var(--button);
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .empty {
        color: var(--muted);
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <div id="app" class="muted">Loading…</div>
    <script>
      let nextId = 0
      let view = null
      let isPressing = false
      // Per-row state the server doesn't keep: an open text field, shown details, a press in flight, a copy to show.
      const typing = new Set()
      const details = new Set()
      const sending = new Map()
      const copies = new Map()
      let notice = null
      const pending = new Map()

      function request(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++nextId
          pending.set(id, { resolve, reject })
          parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*')
        })
      }

      window.addEventListener('message', e => {
        const m = e.data
        if (!m || m.jsonrpc !== '2.0') return
        if (m.id != null && !m.method && pending.has(m.id)) {
          const p = pending.get(m.id)
          pending.delete(m.id)
          if (m.error) p.reject(m.error)
          else p.resolve(m.result)
          return
        }
        if (m.method === 'ui/notifications/host-context-changed') applyHost(m.params || {})
        if (m.id != null && m.method) parent.postMessage({ jsonrpc: '2.0', id: m.id, result: {} }, '*')
      })

      function applyHost(ctx) {
        if (ctx.theme) document.documentElement.dataset.theme = ctx.theme
        const vars = ctx.styles && ctx.styles.variables
        if (vars) for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v)
      }

      async function callTool(name, args) {
        const r = await request('tools/call', { name, arguments: args || {} })
        return r && r.structuredContent
      }

      async function refresh() {
        if (isPressing) return
        try {
          view = await callTool('inbox_view')
          render()
        } catch (e) {
          notice = { kind: 'error', text: 'Could not read the inbox.' }
          render()
        }
      }

      async function act(rowId, label, press) {
        sending.set(rowId, label)
        notice = null
        render()
        isPressing = true
        try {
          const r = await callTool('inbox_press', { press })
          if (r && r.view) view = r.view
          if (r && r.error) notice = { kind: 'error', text: r.error }
          if (r && r.copy) await copy(rowId, r.copy)
        } catch (e) {
          notice = { kind: 'error', text: 'The press did not reach the inbox.' }
        } finally {
          isPressing = false
          sending.delete(rowId)
          render()
        }
      }

      async function copy(rowId, c) {
        try {
          await navigator.clipboard.writeText(c.text)
          notice = { kind: 'ok', text: `Copied ${c.name}.` }
        } catch (e) {
          // The tab's frame may not get the clipboard, so the text shows for a manual copy.
          copies.set(rowId, c)
        }
      }

      function ago(ms) {
        const min = Math.round(ms / 60000)
        if (min < 1) return 'just now'
        if (min < 60) return `${min}m ago`
        const h = Math.round(min / 60)
        return h < 48 ? `${h}h ago` : `${Math.round(h / 24)}d ago`
      }

      function h(tag, props, ...children) {
        const el = document.createElement(tag)
        for (const [k, v] of Object.entries(props || {})) {
          if (k === 'onclick' || k === 'onsubmit') el[k] = v
          else if (k === 'class') el.className = v
          else if (v !== false && v != null) el.setAttribute(k, v)
        }
        for (const c of children.flat()) if (c != null && c !== false) el.append(c)
        return el
      }

      function button(label, onclick, cls) {
        return h('button', { class: cls || '', onclick }, label)
      }

      /** What the row's last press did, and a label for pressing it again. */
      function lastLine(rowId, last) {
        if (sending.has(rowId)) return h('div', { class: 'last' }, `${sending.get(rowId)}…`)
        if (!last) return null
        return h(
          'div',
          { class: last.isHandoff ? 'last ok' : 'last' },
          `${last.isHandoff ? '✓ ' : ''}${last.text} · ${ago(view.at - last.at)}`,
        )
      }

      function again(label, last, action) {
        return last && last.action === action ? `${label} again` : label
      }

      function textField(rowId, placeholder, onSend) {
        const input = h('input', { placeholder, 'aria-label': placeholder })
        setTimeout(() => input.focus(), 0)
        return h(
          'form',
          {
            onsubmit: e => {
              e.preventDefault()
              const t = input.value.trim()
              if (!t) return
              typing.delete(rowId)
              onSend(t)
            },
          },
          input,
          h('button', { type: 'submit' }, 'Send'),
          button('Cancel', () => {
            typing.delete(rowId)
            render()
          }),
        )
      }

      function copyBox(rowId) {
        const c = copies.get(rowId)
        if (!c) return null
        const area = h('textarea', { rows: '3', readonly: true })
        area.value = c.text
        setTimeout(() => area.select(), 0)
        return h(
          'div',
          {},
          h('div', { class: 'last' }, `Copy ${c.name} from here:`),
          area,
          button('Close', () => {
            copies.delete(rowId)
            render()
          }),
        )
      }

      function itemRow(item) {
        const last = item.last
        if (item.isHandedOff && !details.has(item.id))
          return h(
            'div',
            { class: 'row' },
            h('div', { class: 'ok' }, `✓ ${last.text} · ${ago(view.at - last.at)}`),
            h('div', { class: 'muted' }, item.ask),
            h(
              'div',
              { class: 'actions' },
              button('Details', () => (details.add(item.id), render()), 'link'),
            ),
          )
        const isQuestion = item.kind === 'question'
        const options = isQuestion
          ? item.options.map((o, n) =>
              button(
                o.isRec ? `${o.text} (recommended)` : o.text,
                () => act(item.id, `Sending "${o.text}"`, { action: 'answer', id: item.id, option: n }),
                o.isRec ? 'primary' : '',
              ),
            )
          : []
        const stepButtons = item.steps.map((label, n) =>
          button(again(label, last, `step-${n}`), () => act(item.id, label, { action: 'step', id: item.id, step: n })),
        )
        const more = [
          ...(isQuestion ? [] : [button('Done', () => act(item.id, 'Marking done', { action: 'done', id: item.id }))]),
          button(isQuestion ? 'Type an answer' : 'Type a reply', () => (typing.add(item.id), render())),
          button(again('Explain', last, 'explain'), () =>
            act(item.id, 'Sending Explain', { action: 'explain', id: item.id }),
          ),
          ...(isQuestion
            ? [button('Dismiss', () => act(item.id, 'Dismissing', { action: 'dismiss', id: item.id }))]
            : []),
          ...(item.isHandedOff ? [button('Hide details', () => (details.delete(item.id), render()), 'link')] : []),
        ]
        return h(
          'div',
          { class: 'row' },
          h('div', { class: 'ask' }, item.label && item.label !== '-' ? `${item.label}. ${item.ask}` : item.ask),
          options.length + stepButtons.length > 0 ? h('div', { class: 'actions' }, options, stepButtons) : null,
          h('div', { class: 'actions' }, more),
          typing.has(item.id)
            ? textField(item.id, isQuestion ? 'Your answer' : 'Your reply', t =>
                act(item.id, 'Sending your words', { action: 'type', id: item.id, text: t }),
              )
            : null,
          copyBox(item.id),
          lastLine(item.id, last),
        )
      }

      function checkRow(c) {
        const rowId = `check:${c.key}`
        if (c.fixSent && !details.has(rowId))
          return h(
            'div',
            { class: 'row' },
            h('div', { class: 'ok' }, `✓ Fix sent${c.last ? ` · ${ago(view.at - c.last.at)}` : ''}`),
            h('div', { class: 'muted' }, `${c.name} failed`),
            h(
              'div',
              { class: 'actions' },
              button('Details', () => (details.add(rowId), render()), 'link'),
            ),
          )
        return h(
          'div',
          { class: 'row' },
          h(
            'div',
            { class: 'ask' },
            h('span', { class: 'error' }, '✗ '),
            `${c.name} failed${c.summary ? `: ${c.summary}` : ''}`,
          ),
          c.failures.length > 0 ? h('div', { class: 'detail muted' }, c.failures.join('\n')) : null,
          h(
            'div',
            { class: 'actions' },
            button(
              c.fixSent ? 'Fix again' : 'Fix',
              () => act(rowId, 'Sending Fix', { action: 'fix', key: c.key }),
              'primary',
            ),
            button('Dismiss', () => act(rowId, 'Dismissing', { action: 'dismissCheck', key: c.key })),
            c.fixSent ? button('Hide details', () => (details.delete(rowId), render()), 'link') : null,
          ),
          lastLine(rowId, c.last),
        )
      }

      function findingRow(f) {
        return h(
          'div',
          { class: 'row' },
          h(
            'div',
            { class: 'ask' },
            h('span', { class: `badge-${f.kind}` }, f.kind === 'issue' ? '▲ ' : '✦ '),
            f.title,
          ),
          h('div', { class: 'detail muted' }, f.detail),
          f.path ? h('div', { class: 'muted' }, f.path) : null,
          h(
            'div',
            { class: 'actions' },
            button('Address', () => act(f.id, 'Sending Address', { action: 'address', id: f.id }), 'primary'),
            button('Discuss', () => act(f.id, 'Sending Discuss', { action: 'discuss', id: f.id })),
            button('Type a reply', () => (typing.add(f.id), render())),
            button('Dismiss', () => act(f.id, 'Dismissing', { action: 'dismissFinding', id: f.id })),
          ),
          typing.has(f.id)
            ? textField(f.id, 'Your reply', t =>
                act(f.id, 'Sending your words', { action: 'typedFinding', id: f.id, text: t }),
              )
            : null,
          lastLine(f.id, f.last),
        )
      }

      function leavingRow(x) {
        return h(
          'div',
          { class: 'row' },
          h('div', { class: 'ok' }, `✓ ${x.text}`),
          h('div', { class: 'muted' }, x.title),
        )
      }

      function render() {
        const app = document.getElementById('app')
        if (!view) return
        const v = view
        const header = [
          v.goal ? h('div', { class: 'goal' }, v.goal) : h('div', { class: 'goal muted' }, 'Nothing summarized yet.'),
          v.now ? h('div', {}, v.now) : null,
          v.done.length > 0 ? h('div', { class: 'muted' }, `Done: ${v.done.join(' · ')}`) : null,
          v.running.length > 0 ? h('div', { class: 'muted' }, `Running: ${v.running.join(' · ')}`) : null,
          h(
            'div',
            { class: 'status' },
            v.waiting > 0 ? h('span', { class: 'waiting' }, `${v.waiting} waiting on you`) : 'Nothing waiting on you',
            v.updating ? ' · updating…' : v.failed ? h('span', { class: 'error' }, ' · the last update failed') : null,
          ),
          notice ? h('div', { class: notice.kind === 'error' ? 'last error' : 'last ok' }, notice.text) : null,
        ]
        const needsYou = [...v.questions.map(itemRow), ...v.tasks.map(itemRow), ...v.checks.map(checkRow)]
        const findings = [...v.leaving.map(leavingRow), ...v.findings.map(findingRow)]
        app.className = ''
        app.replaceChildren(
          ...header.filter(Boolean),
          h('h2', {}, 'Needs you'),
          ...(needsYou.length > 0 ? needsYou : [h('div', { class: 'empty' }, 'No questions or tasks for you.')]),
          h('h2', {}, 'Findings'),
          ...(findings.length > 0
            ? findings
            : [
                h(
                  'div',
                  { class: 'empty' },
                  'No findings. Codex records bugs, risks and opportunities it notices outside the task here.',
                ),
              ]),
          ...(v.closed.length > 0
            ? [
                h('h2', {}, 'Recently closed'),
                ...v.closed.map(d => h('div', { class: 'row muted' }, `${d.ask} → ${d.outcome}`)),
              ]
            : []),
        )
      }

      request('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: { name: 'inbox', version: '0.1.0' },
        appCapabilities: { tools: {} },
      })
        .then(r => {
          applyHost((r && r.hostContext) || {})
          parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*')
          refresh()
          setInterval(refresh, 3000)
        })
        .catch(() => {
          document.getElementById('app').textContent = 'The inbox could not connect to Codex.'
        })
    </script>
  </body>
</html>
