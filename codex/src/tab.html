<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        --key: #243bf5;
        --needs-you: #745417;
        --findings: #7b00e8;
        --done: #25652f;
        --error: #a5293d;
        --error-mark: #a5293d;
        --sans: var(--font-sans, -apple-system, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        /* Surfaces are mixed from the host's colors, so they follow its theme. */
        --card: color-mix(in srgb, var(--text) 4.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 9%, var(--bg));
        --selected: color-mix(in srgb, #4c9aff 20%, var(--card));
        --divider: color-mix(in srgb, var(--text) 9%, var(--bg));
        --hover: color-mix(in srgb, var(--key) 14%, transparent);
        /* Codex's gray button fills: the foreground at 8% and 12% in light, 12% and 16% in dark. */
        --soft: color-mix(in oklab, var(--text) 8%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 12%, transparent);
        /* The Codex app's timing: --transition-duration-basic with ease, --cubic-move, --cubic-enter, --ease-spring-snappy. */
        --quick: 150ms ease;
        --move: 200ms cubic-bezier(0.65, 0, 0.35, 1);
        --enter: 300ms cubic-bezier(0.19, 1, 0.22, 1);
        --spring: 300ms
          linear(
            0,
            0.086,
            0.2539,
            0.428,
            0.5786,
            0.698,
            0.7879,
            0.8534,
            0.8998,
            0.9323,
            0.9546,
            0.9697,
            0.98,
            0.9868,
            0.9913,
            0.9943,
            0.9963,
            0.9976,
            0.9985,
            1
          );
        /* Where a row's mark sits, and where its text starts. */
        --mark-x: 18px;
        --text-x: 44px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: var(--color-background-primary, #171717);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #a8a8a8);
          --key: #b1b9f9;
          --needs-you: #ffc107;
          --findings: #cab0ff;
          --done: #7ecd8f;
          --error: #ffa3b0;
          --error-mark: #ff6b80;
          --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
          --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
          --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
          --divider: color-mix(in srgb, var(--text) 8%, var(--bg));
          --soft: color-mix(in oklab, var(--text) 12%, transparent);
          --soft-hover: color-mix(in oklab, var(--text) 16%, transparent);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --key: #b1b9f9;
        --needs-you: #ffc107;
        --findings: #cab0ff;
        --done: #7ecd8f;
        --error: #ffa3b0;
        --error-mark: #ff6b80;
        --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
        --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
        --divider: color-mix(in srgb, var(--text) 8%, var(--bg));
        --soft: color-mix(in oklab, var(--text) 12%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 16%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
      }
      :focus-visible {
        outline: 1.5px solid var(--key);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .notice {
        padding: 10px 16px;
        color: var(--error);
        overflow-wrap: anywhere;
      }
      .notice .key {
        color: var(--text);
      }

      /* Tabs: the shown one a raised panel, the others text on the background. */
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 12px 12px 0;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.shown {
        background: var(--raised);
        color: var(--text);
        font-weight: 600;
      }
      .tab .count {
        font-weight: 600;
        margin-left: 6px;
      }
      .status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      .status-line {
        flex-basis: 100%;
        padding: 0 4px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 12px 4px;
      }
      section {
        background: var(--card);
        border-radius: 8px;
        padding: 10px 0;
      }
      .group-title {
        padding: 0 14px 6px var(--mark-x);
        font-weight: 500;
      }
      .group-title .count {
        color: var(--muted);
        margin-left: 6px;
      }

      /* Rows. A divider runs from the text column to the edge. */
      .row {
        display: flex;
        padding: 6px 14px 6px var(--mark-x);
      }
      .entry + .entry > .row {
        background-image: linear-gradient(var(--divider), var(--divider));
        background-repeat: no-repeat;
        background-size: calc(100% - var(--text-x)) 1px;
        background-position: right top;
      }
      /* An open row keeps a closed row's padding, so its line does not move as it opens. */
      .row.selected {
        background-color: var(--selected);
      }
      /* A row that just appeared, in its tab's color. */
      .row.new {
        box-shadow: inset 3px 0 0 var(--bar);
      }
      .tone-bar-needsYou {
        --bar: var(--needs-you);
      }
      .tone-bar-findings {
        --bar: var(--findings);
      }
      /* Marks center in a badge's width, so a ?, a • and a number line up. */
      .mark {
        flex: none;
        width: calc(var(--text-x) - var(--mark-x));
        padding-right: 8px;
        text-align: center;
        color: var(--muted);
      }
      .mark .number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        font-size: 11px;
        font-weight: 500;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        vertical-align: 1px;
      }
      .mark.done {
        color: var(--done);
      }
      .mark.issue {
        color: var(--needs-you);
      }
      .mark.opportunity {
        color: var(--done);
      }
      .mark.error {
        color: var(--error-mark);
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Its space above is padding, not a gap, so the row's height grows smoothly when the panel mounts. */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 0 6px;
      }
      .content > .tight,
      .content.tight {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .line {
        display: flex;
        width: 100%;
        min-width: 0;
      }
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .text.two {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        flex: none;
        white-space: pre;
        color: var(--muted);
      }
      .line .after.tone-done {
        color: var(--done);
      }
      /* Open, and while closing, the title shows in full where it stood, with the age following its last word. */
      .row.selected .line,
      .row.closing .line {
        display: block;
      }
      .row.selected .line .text,
      .row.closing .line .text {
        display: inline;
        white-space: normal;
      }
      .row.selected .line .after,
      .row.closing .line .after {
        white-space: normal;
      }
      .row.collapsed:hover {
        background-color: var(--soft);
      }
      /* After a click, rows slide under a pointer that has not moved, so nothing they bring under it lights up. */
      .still .row.collapsed:hover {
        background-color: transparent;
      }
      .still .fold:hover {
        color: var(--muted);
      }
      .title {
        font-weight: 600;
      }
      .title .after {
        font-weight: 400;
        color: var(--muted);
      }
      .meta {
        font-size: 12px;
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0;
      }
      .body p + p {
        margin-top: 4px;
      }
      /*
       * Actions are Codex's own pill buttons, size sm: the recommended option is solid, the row's other
       * answers are a soft gray fill, and the follow-ups are ghost buttons. Keys are an extra, so no key text shows.
       */
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 26px;
        padding: 3px 11px;
        border-radius: 999px;
        background: var(--soft);
        font-weight: 500;
        text-align: center;
        white-space: nowrap;
      }
      .key:not(:disabled):hover {
        background: var(--soft-hover);
      }
      .key:focus-visible {
        outline-width: 2px;
        outline-offset: 2px;
        border-radius: 999px;
      }
      .key.primary {
        background: var(--text);
        color: var(--bg);
      }
      .key.primary:not(:disabled):hover {
        background: color-mix(in srgb, var(--text) 82%, var(--bg));
      }
      .key .icon {
        flex: none;
        width: 14px;
        height: 14px;
      }
      .key.ghost {
        background: none;
        color: var(--muted);
      }
      .key.ghost:not(:disabled):hover {
        color: var(--text);
      }
      .key-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
      }
      .key-groups > .keys {
        min-width: 0;
      }
      /* A follow-up group that starts a line puts its first label under the row's text, as Codex aligns a leading ghost button. */
      .follow-ups.starts-line {
        margin-left: -11px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input {
        flex: 1;
        min-width: 0;
        min-height: 26px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid color-mix(in oklab, var(--text) 16%, transparent);
        border-radius: 999px;
        padding: 2px 11px;
      }
      input:focus {
        outline: none;
        border-color: var(--key);
        border-radius: 999px;
      }
      textarea {
        width: 100%;
        font: 12px var(--mono);
        color: inherit;
        background: var(--bg);
        border: 1px solid color-mix(in oklab, var(--text) 16%, transparent);
        border-radius: 6px;
      }

      .empty-line {
        color: var(--muted);
      }
      .fold {
        display: block;
        margin: 8px 0 0 calc(var(--mark-x) - 2px);
        padding: 1px 4px;
        border-radius: 5px;
        color: var(--muted);
      }
      .fold:hover {
        color: var(--text);
      }
      .fold .icon {
        width: 12px;
        height: 12px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      /* The closed items sit under the fold's label. */
      .closed-list {
        --mark-x: 34px;
        --text-x: 60px;
        padding-top: 4px;
      }
      .closed-list .entry + .entry > .row {
        background-image: none;
      }
      .outcome {
        font-weight: 600;
      }
      .outcome.lapsed {
        font-weight: 400;
        color: var(--muted);
      }
      /* A row that just closed keeps a closed row's height, so the list does not change its rhythm. */
      .row.settled {
        align-items: center;
      }
      .settled-line {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .settled-line.wraps {
        white-space: normal;
      }
      .settled .outcome-label {
        font-weight: 500;
      }
      .settled .what {
        color: var(--muted);
      }
      .undo-group {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        margin: -3px -11px -3px 12px;
      }
      /* Undo is a text button, as Codex draws its own Undo, kept to the line's height. */
      .undo-group .key {
        min-height: 26px;
      }
      /* The time Undo has left: a wedge that empties clockwise from the top, like a clock. A partial ring would read as a spinner. */
      .clock {
        width: 14px;
        height: 14px;
      }
      .clock circle {
        fill: none;
      }
      .clock .track {
        fill: var(--soft);
      }
      .clock .left {
        stroke: color-mix(in oklab, var(--text) 45%, transparent);
        stroke-width: 7;
        stroke-dasharray: 100;
        animation-name: unwind;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      .clock.paused .left {
        animation-play-state: paused;
      }
      @keyframes unwind {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: 100;
        }
      }
      /* The page is at least the pane's height. The footer sits at its bottom, and an empty tab's text fills the space above it. */
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 4px;
      }
      footer {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .demo-toggle {
        padding: 0 6px;
        border-radius: 5px;
        color: var(--muted);
      }
      .demo-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      .demo-note {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 12px 12px 0;
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--raised);
        color: var(--text);
      }
      /*
       * Motion, with the Codex app's own timing. Hover and fills change over 150 ms, and what a draw
       * mounts fades in from @starting-style. Heights move in the script, around each draw.
       */
      .key,
      .tab,
      .row,
      .fold {
        transition:
          background-color var(--quick),
          color var(--quick),
          box-shadow var(--enter),
          transform var(--spring);
      }
      .key:not(:disabled):active {
        transform: scale(0.97);
      }
      .panel {
        transition:
          opacity 200ms ease 40ms,
          translate var(--enter);
        @starting-style {
          opacity: 0;
          translate: 0 -4px;
        }
      }
      .panel.closing {
        opacity: 0;
        translate: 0 -4px;
        transition:
          opacity 120ms ease,
          translate var(--move);
      }
      .row > .content,
      .status-line,
      .demo-note,
      .empty,
      main,
      form {
        transition: opacity var(--quick);
        @starting-style {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
        }
        /* With no motion, the clock shows no time left, so it is not drawn. */
        .clock {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="notice muted">Loading…</div>
    <script>
      /*TAB_SCRIPT*/
    </script>
  </body>
</html>
