<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="inbox-handoff" content="1" />
    <title>Inbox</title>
    <style id="inbox-style">
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        /*TONES:light*/
        --needs-you: var(--amber);
        --issue: var(--amber);
        --sans: var(--font-sans, -apple-system, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        --raised: color-mix(in srgb, var(--text) 9%, var(--bg));
        --selected: color-mix(in srgb, var(--text) 6%, var(--bg));
        --age: color-mix(in srgb, var(--muted) 90%, var(--bg));
        --hover: color-mix(in srgb, var(--key) 14%, transparent);
        --soft: color-mix(in oklab, var(--text) 8%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 10%, transparent);
        --row-hover: color-mix(in oklab, var(--soft) 50%, transparent);
        --quick: 150ms ease;
        --mark-x: 18px;
        --text-x: 44px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: var(--color-background-primary, #171717);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #a8a8a8);
          /*TONES:dark*/
          --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
          --selected: color-mix(in srgb, var(--text) 8%, var(--bg));
          --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
          --soft: color-mix(in oklab, var(--text) 12%, transparent);
          --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        /*TONES:dark*/
        --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
        --selected: color-mix(in srgb, var(--text) 8%, var(--bg));
        --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
        --soft: color-mix(in oklab, var(--text) 12%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
      }
      /* Text a person may copy: what an item, PR or Overview line says, an error, and the reply field. */
      .overview-goal,
      .overview .content,
      .earlier,
      .body,
      .panel .muted,
      .settled-line .what,
      .pr-head,
      .tone-error,
      input,
      textarea {
        cursor: auto;
        user-select: text;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
      }
      :focus-visible {
        outline: 1.5px solid var(--key);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-prs {
        color: var(--prs);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .notice {
        padding: 10px 16px;
        overflow-wrap: anywhere;
      }
      /* A message about the inbox's own state, in the tone of what it says. */
      .banner {
        --tone: var(--error);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-basis: 100%;
        padding: var(--banner-pad-y) 12px;
        border: 1px solid color-mix(in srgb, var(--tone) 30%, var(--bg));
        border-radius: 10px;
        background: color-mix(in srgb, var(--tone) 9%, var(--bg));
        color: var(--text);
        line-height: 19px;
        overflow-wrap: anywhere;
        cursor: auto;
        user-select: text;
      }
      .banner-warning {
        --tone: var(--needs-you);
      }
      /* --muted is see-through in the Codex app, so a notice mixes from the text color. */
      .banner-notice {
        --tone: var(--text);
      }
      .banner .lead {
        font-weight: 600;
        color: var(--tone);
      }
      /* The tab bar's rows sit 4px apart. */
      nav > .banner {
        margin-top: calc(var(--banner-gap) - 4px);
      }
      #app > .banner {
        margin: 12px 12px 0;
      }
      .banner-place {
        padding: 12px 12px 0;
      }
      .banner .key {
        flex: none;
        white-space: nowrap;
        color: var(--text);
        cursor: default;
        user-select: none;
      }

      nav {
        container: tab-bar / inline-size;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 12px 12px 0;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tab {
        position: relative;
        white-space: nowrap;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.shown {
        background: var(--raised);
        color: var(--text);
        font-weight: 600;
      }
      .tab .count {
        font-weight: 600;
        margin-left: 6px;
      }
      /* --muted is see-through in the Codex app, and a color emoji takes its color's transparency. */
      .tab-symbol {
        display: none;
        color: var(--text);
      }
      @container tab-bar (width < 316px) {
        .tab-symbol {
          display: inline;
        }
        .tab-word {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        }
      }
      .status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }

      main {
        display: flex;
        flex-direction: column;
        padding: 8px 0 4px;
      }
      section {
        position: relative;
        padding: 10px 0;
      }
      section + section::before {
        content: '';
        position: absolute;
        top: 0;
        left: var(--text-x);
        right: 0;
        height: 1px;
        background: var(--soft);
      }
      .group-title {
        padding: 0 14px 6px var(--text-x);
      }
      .group-title {
        position: relative;
      }
      .group-title b {
        font-weight: 600;
      }
      .group-mark {
        position: absolute;
        left: var(--mark-x);
        width: calc(var(--text-x) - var(--mark-x) - 8px);
        text-align: center;
      }
      .group-mark.done {
        color: var(--done);
      }
      .group-mark.issue {
        color: var(--issue);
      }
      .group-title .count {
        color: var(--muted);
        white-space: pre;
      }

      .pr-head,
      .pr-status,
      .pr-actions,
      .pr-last {
        padding: 0 14px 0 var(--text-x);
        overflow-wrap: anywhere;
      }
      .pr-head {
        font-weight: 600;
      }
      .pr-head .num,
      .pr-head .pr-verdict {
        font-weight: 400;
      }
      .pr-actions {
        margin-top: 8px;
      }
      .pr-last {
        margin-top: 6px;
      }
      .pr-groups {
        margin-top: 12px;
      }
      .pr-groups .list {
        --mark-x: 41px;
        --text-x: 67px;
      }
      .pr-groups .group-title + .list {
        margin-bottom: 6px;
      }
      .link {
        padding: 0;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: color-mix(in oklab, var(--text) 30%, transparent);
        text-underline-offset: 2px;
      }
      .link:hover {
        text-decoration-color: currentColor;
      }

      .row {
        display: grid;
        grid-template-columns: calc(var(--text-x) - var(--mark-x)) minmax(0, 1fr) auto;
        padding: var(--row-pad) 14px var(--row-pad) var(--mark-x);
      }
      .row.selected {
        background-color: var(--selected);
      }
      .mark {
        align-self: start;
        padding-right: 8px;
        text-align: center;
        color: var(--muted);
      }
      .mark.done {
        color: var(--done);
      }
      .mark.issue {
        color: var(--issue);
      }
      .mark.error {
        color: var(--error-mark);
      }
      .side {
        align-self: start;
        margin-left: 12px;
        color: var(--age);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: right;
      }
      .mark.tone-needsYou,
      .side.tone-needsYou {
        color: var(--needs-you);
      }
      .side[data-room]::after {
        content: attr(data-room);
        display: block;
        height: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .side-label {
        display: inline-block;
        max-width: 11em;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        margin-right: 4px;
      }
      .row.collapsed:hover .side {
        color: var(--muted);
      }
      .content {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Its space above is padding, not a gap, so the row's height grows smoothly when the panel mounts. */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 0 2px;
      }
      .row > .panel {
        grid-column: 2 / -1;
      }
      .content.tight {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .line {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
      }
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        color: var(--muted);
      }
      .row.collapsed .line .after:not(.tone-error) {
        color: var(--age);
      }
      .row.collapsed:hover .line .after:not(.tone-error) {
        color: var(--muted);
      }
      .line .after.tone-error {
        color: var(--error);
      }
      .row.selected .line,
      .row.closing .line {
        display: block;
      }
      .row.selected .line .text,
      .row.closing .line .text {
        display: inline;
        font-weight: 600;
      }
      .row.selected .line .after,
      .row.closing .line .after {
        white-space: normal;
        font-weight: 400;
      }
      .line .lead {
        color: var(--muted);
        font-weight: 400;
      }
      .line .meta {
        display: block;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row.collapsed:not(:hover) .line .meta {
        color: var(--age);
      }
      .line .holds-up {
        display: block;
        color: var(--muted);
        font-weight: 400;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row.selected .line .meta {
        display: none;
      }
      .quote {
        white-space: pre-line;
      }
      .row.collapsed:hover {
        background-color: var(--row-hover);
      }
      .still .row.collapsed:not(:active):hover {
        background-color: transparent;
      }
      .still .fold:not(:active):hover {
        color: var(--muted);
      }
      .title {
        font-weight: 600;
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0;
      }
      .body p + p {
        margin-top: 4px;
      }
      .body .option-description {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .body .option-description + .option-description {
        margin-top: 0;
      }
      code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--soft);
        font-family: var(--mono);
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .follow-ups {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        max-width: 100%;
      }
      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 26px;
        padding: 3px 11px;
        border: 1px solid color-mix(in oklab, var(--text) 28%, transparent);
        border-radius: 13px;
        background: transparent;
        font-weight: 400;
        text-align: center;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .key:not(:disabled):hover {
        background: var(--soft);
      }
      .key:focus-visible {
        outline-width: 2px;
        outline-offset: 2px;
        border-radius: 13px;
      }
      .key.primary {
        border-color: transparent;
        background: var(--text);
        color: var(--bg);
      }
      .key.primary:not(:disabled):hover {
        background: color-mix(in srgb, var(--text) 82%, var(--bg));
      }
      .key .icon {
        flex: none;
        width: 14px;
        height: 14px;
      }
      .key.ghost {
        padding: 0 4px;
        border-color: transparent;
        background: none;
        color: var(--muted);
      }
      .key.ghost:not(:disabled):hover {
        background: none;
        color: var(--text);
      }
      .key.out {
        opacity: 0.4;
        transition: opacity var(--quick);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input {
        flex: 1;
        min-width: 0;
        min-height: 28px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
        padding: 4px 10px;
      }
      input::placeholder {
        color: var(--muted);
      }
      /* The radius again, since :focus-visible sets 4px. */
      input:focus,
      textarea:focus {
        outline: none;
        border-color: color-mix(in oklab, var(--text) 32%, transparent);
        border-radius: 10px;
      }
      textarea {
        width: 100%;
        font: 12px var(--mono);
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
      }

      .group-end {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      /* Keeps the fold's margin inside, so its height is the whole end's content height. */
      .group-end-content {
        display: flow-root;
        position: relative;
      }
      .group-empty {
        padding: var(--row-pad) 14px var(--row-pad) var(--text-x);
        color: var(--muted);
      }
      .group-empty.leaving {
        position: absolute;
        inset: auto 0 100% 0;
        pointer-events: none;
        animation: fade-out var(--enter) forwards;
      }
      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }
      .fold {
        display: block;
        margin: 8px 0 0 calc(var(--mark-x) - 1px);
        padding: 1px 4px;
        border-radius: 5px;
        color: var(--muted);
      }
      .fold:hover {
        color: var(--text);
      }
      .fold .icon {
        width: 12px;
        height: 12px;
        margin-right: calc(var(--text-x) - var(--mark-x) - 15px);
        vertical-align: -1px;
      }
      .closed-list {
        --mark-x: 41px;
        --text-x: 67px;
      }
      /* The gap above a Closed list's rows is content, not padding, so the list opens from and closes to 0. */
      .closed-list::before {
        content: '';
        display: block;
        height: 4px;
      }
      .closed-list .row {
        padding-top: calc(var(--row-pad) / 2);
        padding-bottom: calc(var(--row-pad) / 2);
      }
      .outcome {
        color: var(--age);
      }
      .settled-head {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .row.settled.was-open {
        transition: background-color var(--move);
        @starting-style {
          background-color: var(--selected);
        }
      }
      .settled-line {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .settled .outcome-label {
        color: var(--muted);
      }
      /* The pill keeps the line's height, so the row does not grow. */
      .key.undo {
        flex: none;
        white-space: nowrap;
        border-color: transparent;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: -3px 0 -3px 12px;
        background: color-mix(in oklab, var(--soft) 45%, transparent);
      }
      .key.undo.undoing {
        color: var(--muted);
      }
      .key.undo.spent {
        visibility: hidden;
      }
      .key.undo.undoing .icon {
        animation: undo-turn 900ms linear infinite;
      }
      @keyframes undo-turn {
        to {
          transform: rotate(-360deg);
        }
      }
      .time-left {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--soft);
        transform-origin: left;
        animation-name: empty;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      .key.undo:not(:disabled):hover .time-left {
        background: var(--soft-hover);
      }
      .time-left.paused {
        animation-play-state: paused;
      }
      @keyframes empty {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 4px;
      }
      footer {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .footer-end {
        display: flex;
        gap: 16px;
        margin-left: auto;
      }
      .version {
        color: color-mix(in srgb, var(--muted) 50%, var(--bg));
      }
      .demo-toggle {
        padding: 0 6px;
        border-radius: 5px;
        color: var(--muted);
      }
      .demo-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      .earlier {
        padding: 2px 14px 2px var(--text-x);
      }
      /* The goal starts where the list's marks do. */
      .overview-goal {
        padding: 0 14px 0 var(--mark-x);
        overflow-wrap: anywhere;
      }
      .overview .row {
        padding-top: var(--overview-row-pad);
        padding-bottom: var(--overview-row-pad);
      }
      .overview .mark {
        text-align: left;
      }
      .mark.running {
        animation: running-pulse var(--pulse) ease-in-out infinite;
      }
      @keyframes running-pulse {
        50% {
          opacity: 0.3;
        }
      }
      .overview .content {
        overflow-wrap: anywhere;
      }
      .overview .row.child {
        padding-left: var(--text-x);
      }
      .overview .clamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: var(--lines);
        overflow: hidden;
      }
      .overview .unbroken {
        white-space: nowrap;
      }
      /* The tree line runs under the middle of a subject's mark, and its arm reaches to a child's mark. */
      .overview .list {
        --mark-middle: 6px;
        --arm-gap: 2px;
        --tree-x: calc(var(--mark-x) + var(--mark-middle));
        --tree-line: color-mix(in oklab, var(--text) 15%, transparent);
      }
      .overview .row.has-children,
      .overview .row.branch-mid,
      .overview .row.branch-last {
        position: relative;
      }
      .overview .row.has-children::before,
      .overview .row.branch-mid::before,
      .overview .row.branch-last::before {
        content: '';
        position: absolute;
        left: var(--tree-x);
        border-left: 1px solid var(--tree-line);
      }
      .overview .row.has-children::before {
        top: calc(var(--overview-row-pad) + 1lh);
        bottom: 0;
      }
      .overview .row.branch-mid::before {
        top: 0;
        bottom: 0;
      }
      .overview .row.branch-last::before {
        top: 0;
        height: calc(var(--overview-row-pad) + 0.5lh);
      }
      .overview .row.branch-mid::after,
      .overview .row.branch-last::after {
        content: '';
        position: absolute;
        left: var(--tree-x);
        top: calc(var(--overview-row-pad) + 0.5lh);
        width: calc(var(--text-x) - var(--tree-x) - var(--arm-gap));
        border-top: 1px solid var(--tree-line);
      }
      /* "Seen" in the middle of a rule that runs from the mark column to the end of the row. */
      .overview .look-rule {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .overview .overview-rule {
        height: 1px;
        margin-left: var(--text-x);
        background: var(--soft);
      }
      .overview .look-rule::before,
      .overview .look-rule::after {
        content: '';
        flex: 1;
        border-top: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
      }
      .overview-goal {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        font-weight: 600;
      }
      .banner,
      .empty,
      main,
      form {
        transition: opacity var(--quick);
        @starting-style {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
        }
