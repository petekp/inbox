<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        --key: #243bf5;
        --needs-you: #745417;
        --findings: #7b00e8;
        --done: #25652f;
        --error: #a5293d;
        --error-mark: #a5293d;
        --sans: var(--font-sans, -apple-system, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        /* Surfaces are mixed from the host's colors, so they follow its theme. */
        --card: color-mix(in srgb, var(--text) 4.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 9%, var(--bg));
        --selected: color-mix(in srgb, #4c9aff 20%, var(--card));
        --tree: color-mix(in srgb, var(--text) 30%, var(--bg));
        --divider: color-mix(in srgb, var(--text) 9%, var(--bg));
        --hover: color-mix(in srgb, var(--key) 14%, transparent);
        /* The tree's grid: its line, where a row's mark sits, and where its text starts. */
        --tree-x: 15px;
        --mark-x: 30px;
        --text-x: 52px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: var(--color-background-primary, #171717);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #a8a8a8);
          --key: #b1b9f9;
          --needs-you: #ffc107;
          --findings: #cab0ff;
          --done: #7ecd8f;
          --error: #ffa3b0;
          --error-mark: #ff6b80;
          --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
          --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
          --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
          --tree: color-mix(in srgb, var(--text) 32%, var(--bg));
          --divider: color-mix(in srgb, var(--text) 8%, var(--bg));
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --key: #b1b9f9;
        --needs-you: #ffc107;
        --findings: #cab0ff;
        --done: #7ecd8f;
        --error: #ffa3b0;
        --error-mark: #ff6b80;
        --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
        --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
        --tree: color-mix(in srgb, var(--text) 32%, var(--bg));
        --divider: color-mix(in srgb, var(--text) 8%, var(--bg));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      :focus-visible {
        outline: 1.5px solid var(--key);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .notice {
        padding: 10px 16px;
        color: var(--error);
      }
      .notice .key {
        color: var(--text);
      }

      /* Line 1: the count and the status. Line 2: the goal and its current step. */
      header {
        padding: 12px 16px 0;
      }
      .line-one {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0 16px;
      }
      .counts {
        font-weight: 600;
      }
      .goal {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .goal-mark {
        color: var(--key);
      }

      /* Tabs: the shown one a raised panel, the others text on the background. */
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 8px 12px 0;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.shown {
        background: var(--raised);
        color: var(--text);
        font-weight: 600;
      }
      .tab .count {
        font-weight: 600;
        margin-left: 6px;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 12px 4px;
      }
      section {
        background: var(--card);
        border-radius: 8px;
        padding: 10px 0;
      }
      .group-title {
        padding: 0 14px 0 calc(var(--tree-x) + 4px);
        font-weight: 500;
      }
      .group-title .count {
        color: var(--muted);
        margin-left: 6px;
      }

      /* The tree: a hairline from the group's title, an elbow to each row, and a rounded last elbow. */
      .tree {
        position: relative;
        padding-top: 8px;
      }
      .tree::before {
        content: '';
        position: absolute;
        left: var(--tree-x);
        top: 0;
        height: 8px;
        border-left: 1px solid var(--tree);
      }
      .entry {
        position: relative;
        --elbow: 16px;
      }
      .entry:has(> .row.selected) {
        --elbow: 22px;
      }
      .tree > .entry::before {
        content: '';
        position: absolute;
        left: var(--tree-x);
        top: 0;
        bottom: 0;
        border-left: 1px solid var(--tree);
        z-index: 1;
      }
      .tree > .entry::after {
        content: '';
        position: absolute;
        left: var(--tree-x);
        top: var(--elbow);
        width: 11px;
        border-top: 1px solid var(--tree);
        z-index: 1;
      }
      .tree > .entry:last-child::before {
        bottom: auto;
        height: calc(var(--elbow) + 1px);
        width: 11px;
        border-bottom: 1px solid var(--tree);
        border-bottom-left-radius: 7px;
      }
      .tree > .entry:last-child::after {
        display: none;
      }
      .flat {
        --mark-x: 18px;
        --text-x: 40px;
      }

      /* Rows. A divider runs from the text column to the edge, under the tree's line. */
      .row {
        display: flex;
        padding: 6px 14px 6px var(--mark-x);
      }
      .entry + .entry > .row {
        background-image: linear-gradient(var(--divider), var(--divider));
        background-repeat: no-repeat;
        background-size: calc(100% - var(--text-x)) 1px;
        background-position: right top;
      }
      .row.selected {
        background-color: var(--selected);
        padding-top: 12px;
        padding-bottom: 12px;
      }
      /* A row that just appeared, in its tab's color. */
      .row.new {
        box-shadow: inset 3px 0 0 var(--bar);
      }
      .tone-bar-needsYou {
        --bar: var(--needs-you);
      }
      .tone-bar-findings {
        --bar: var(--findings);
      }
      .mark {
        flex: none;
        width: calc(var(--text-x) - var(--mark-x));
        font: 12px/20px var(--mono);
        color: var(--muted);
      }
      .mark.done,
      .mark.error {
        font-size: 13px;
      }
      .mark.done {
        color: var(--done);
      }
      .mark.error {
        color: var(--error-mark);
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .content > .tight,
      .content.tight {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .line {
        display: flex;
        width: 100%;
        min-width: 0;
      }
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .text.two {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        flex: none;
        white-space: pre;
        color: var(--muted);
      }
      .line .after.tone-done {
        color: var(--done);
      }
      .line:hover .text {
        color: color-mix(in srgb, var(--text) 80%, var(--key));
      }
      .title {
        font-weight: 600;
      }
      .title .after {
        font-weight: 400;
        color: var(--muted);
      }
      .meta {
        font-size: 12px;
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0;
      }
      .body p + p {
        margin-top: 4px;
      }
      /* Keys are text buttons, with no key text: keys are an extra. */
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
        margin-left: -6px;
      }
      .key {
        padding: 1px 6px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .key:hover {
        background: var(--hover);
      }
      /* The row just opened, so a click on its keys would be a double-click's second. */
      .key:disabled {
        color: var(--muted);
        background: none;
      }
      /* The option Claude recommended. */
      .key.primary {
        font-weight: 600;
      }
      .key-dot {
        color: var(--muted);
      }
      form {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--tree);
        border-radius: 6px;
        padding: 4px 8px;
      }
      input:focus {
        outline: none;
        border-color: var(--key);
      }
      textarea {
        width: 100%;
        font: 12px var(--mono);
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--tree);
        border-radius: 6px;
      }

      .empty-line {
        color: var(--muted);
      }
      .fold {
        display: block;
        margin: 8px 0 0 calc(var(--mark-x) - 2px);
        padding: 1px 4px;
        border-radius: 5px;
        color: var(--muted);
      }
      .fold:hover {
        color: var(--text);
      }
      .fold-mark {
        display: inline-block;
        width: 14px;
        font-family: var(--mono);
      }
      /* The closed items hang from the fold's arrow. */
      .tree.closed-tree {
        --tree-x: 36px;
        --mark-x: 52px;
        --text-x: 72px;
        padding-top: 4px;
      }
      .tree.closed-tree::before {
        height: 4px;
      }
      .tree.closed-tree .entry + .entry > .row {
        background-image: none;
      }
      .outcome {
        font-weight: 600;
      }
      .outcome.lapsed {
        font-weight: 400;
        color: var(--muted);
      }
      .settled .what {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leave {
        width: 96px;
        height: 1.5px;
        margin-top: 4px;
        border-radius: 1px;
        overflow: hidden;
      }
      .leave div {
        height: 100%;
        background: var(--done);
        animation-name: leave;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes leave {
        from {
          width: 100%;
        }
        to {
          width: 0;
        }
      }
      .empty {
        padding: 56px 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 4px;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .demo-toggle {
        padding: 0 6px;
        border-radius: 5px;
        color: var(--muted);
      }
      .demo-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      .demo-note {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 12px 12px 0;
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--raised);
        color: var(--text);
      }
      @media (prefers-reduced-motion: reduce) {
        .leave div {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="notice muted">Loading…</div>
    <script>
      /*TAB_SCRIPT*/
    </script>
  </body>
</html>
