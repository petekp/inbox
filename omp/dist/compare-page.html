<!doctype html>
<!--
  The inbox's page for a comparison of a question's choices. To make one, write the comparison as JSON, then append
  it to a copy of this file:

    cat "<this file>" comparison.json > comparison.html

  The JSON. Only "pick" and "choices" are required:

  {
    "question": "Which cache should the product API use?",
    "pick": "Redis",
    "pickBefore": "In-memory",
    "reason": "Every instance serves the same prices, for 3 ms more per read.",
    "unexpected": "In-memory kept a changed price for up to 5 minutes.",
    "choices": [
      { "name": "Redis", "summary": "One cache that all four instances share." },
      { "name": "In-memory", "summary": "Each instance keeps its own cache." }
    ],
    "measures": [
      {
        "name": "Stale prices after a change",
        "better": "fewer is better",
        "values": { "Redis": "None", "In-memory": { "value": "Up to 5 minutes", "note": "Until each cache expires" } },
        "best": ["Redis"]
      },
      { "name": "Read time", "better": "less is better", "values": { "Redis": "4 ms", "In-memory": "1 ms" }, "best": ["In-memory"] }
    ],
    "previews": [{ "title": "After a price change", "note": "One request to each instance.", "texts": { "Redis": "...", "In-memory": "..." } }],
    "caveats": ["Measured on a laptop, not in production."],
    "method": "How you compared them: one string, or a list of paragraphs."
  }

  - Name each choice exactly as the question lists it, everywhere a choice is named.
  - "pickBefore" is the choice you would have picked before comparing. Leave it out when you had none.
  - Put first the measures a person notices when using the choice.
  - A value is text, or an object with the "value" and a "note" that explains it.
  - "best" names the choice or choices with the best value on that measure. Leave it out when none is best.
  - A preview is preformatted text for each choice, such as a mock or a diagram.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparison</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f4f5f7;
        --surface: #ffffff;
        --ink: #1a1c21;
        --muted: #5b616c;
        --rule: #dcdfe5;
        --code: #eceef2;
        --pick: #243bf5;
        --on-pick: #ffffff;
        --band: color-mix(in srgb, var(--pick) 7%, var(--page));
        --card-band: color-mix(in srgb, var(--pick) 6%, var(--surface));
        --best: #25652f;
        --best-tint: #dcefdf;
        --odd: #745417;
        --error: #a5293d;
        --error-tint: #fbe9ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #131418;
          --surface: #1b1d22;
          --ink: #e8e9ed;
          --muted: #a3a9b4;
          --rule: #2e3139;
          --code: #15171b;
          --pick: #4b63ff;
          --on-pick: #ffffff;
          --band: color-mix(in srgb, var(--pick) 14%, var(--page));
          --card-band: color-mix(in srgb, var(--pick) 14%, var(--surface));
          --best: #7ecd8f;
          --best-tint: #1d3a26;
          --odd: #ffc107;
          --error: #ffa3b0;
          --error-tint: #3a1d23;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-text-size-adjust: 100%;
      }
      main {
        container: page / inline-size;
        max-width: 76rem;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      figure {
        margin: 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .tag,
      .best {
        flex: none;
        border-radius: 5px;
        font-weight: 700;
        white-space: nowrap;
      }
      .tag {
        padding: 2px 8px;
        background: var(--pick);
        color: var(--on-pick);
        font-size: 12px;
        line-height: 16px;
      }
      .best {
        padding: 1px 6px;
        background: var(--best-tint);
        color: var(--best);
        font-size: 11.5px;
        line-height: 15px;
      }
      .pick,
      .col-name,
      .card-head h2,
      .preview figcaption {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        align-items: center;
        gap: 4px 8px;
      }

      code {
        padding: 0.05em 0.3em;
        border-radius: 4px;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        font:
          0.9em/1 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }

      .verdict {
        max-width: 44rem;
      }
      .question {
        color: var(--muted);
        font-size: 16px;
        font-weight: 550;
        line-height: 1.4;
      }
      .pick {
        margin-top: 10px;
        font-size: clamp(26px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.012em;
        overflow-wrap: anywhere;
      }
      .pick {
        column-gap: 12px;
      }
      .pick .tag {
        padding: 4px 11px;
        border-radius: 7px;
        font-size: 15px;
        line-height: 20px;
      }
      .pick.is-missing {
        color: var(--muted);
      }
      .change {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .reason {
        margin-top: 14px;
        font-size: 17px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .odd {
        margin-top: 18px;
        padding-left: 12px;
        border-left: 3px solid var(--odd);
        overflow-wrap: anywhere;
      }
      .odd strong {
        color: var(--odd);
      }
      .problems {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--error-tint);
        color: var(--error);
        font-size: 14px;
      }
      .problems ul {
        padding-left: 18px;
      }

      .better {
        color: var(--muted);
        font-weight: 400;
        white-space: nowrap;
      }
      .value {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 8px;
        font-size: 15px;
        line-height: 1.45;
      }
      .value.is-best {
        font-weight: 650;
      }
      .value.is-empty {
        color: var(--muted);
        font-style: italic;
      }
      .note {
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .summary {
        color: var(--muted);
        font-size: 14px;
      }
      .tally {
        color: var(--muted);
        font-size: 13px;
      }
      .tally b {
        color: var(--ink);
        font-weight: 650;
      }

      .matrix {
        display: none;
        margin-top: 32px;
        overflow-wrap: anywhere;
      }
      .band {
        margin-bottom: 10px;
        border-radius: 10px;
        background: var(--band);
      }
      .col-name {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 14px 14px 6px;
        background: var(--page);
        font-size: 17px;
        font-weight: 650;
        line-height: 1.3;
      }
      .col-name.is-pick {
        border-radius: 10px 10px 0 0;
        background: var(--band);
      }
      .matrix.is-stuck .col-name {
        box-shadow: 0 1px 0 var(--rule);
      }
      .matrix.is-stuck .col-name.is-pick {
        border-radius: 0;
      }
      .stuck-mark {
        align-self: start;
        height: 1px;
      }
      .col-summary {
        padding: 0 14px 8px;
      }
      .col-tally {
        padding: 0 14px 24px;
      }
      .m-head {
        padding: 14px 14px 4px;
        border-top: 1px solid var(--rule);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }
      .cell {
        padding: 2px 14px 14px;
      }

      .cards {
        display: grid;
        gap: 16px;
        margin-top: 28px;
      }
      .card {
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--surface);
        overflow-wrap: anywhere;
      }
      .card > * {
        padding: 12px 18px;
      }
      .card-head {
        padding-block: 16px 14px;
      }
      .card.is-pick .card-head {
        background: var(--card-band);
      }
      .card-head h2 {
        font-size: 17px;
        font-weight: 650;
        line-height: 1.3;
      }
      .card-head .summary {
        margin-top: 4px;
      }
      .card-head .tally {
        margin-top: 8px;
      }
      .row {
        border-top: 1px solid var(--rule);
      }
      .label {
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }

      @media (min-width: 600px) {
        main {
          padding: 40px 32px 64px;
        }
        .matrix {
          margin-inline: -14px;
        }
      }

      .previews {
        margin-top: 40px;
      }
      .preview-group + .preview-group {
        margin-top: 32px;
      }
      .preview-group h2 {
        font-size: 16px;
        font-weight: 650;
      }
      .preview-group > p {
        max-width: 44rem;
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        margin-top: 12px;
      }
      .preview-grid,
      .mono-probe {
        font:
          12.5px/1.4 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      .mono-probe {
        position: absolute;
        visibility: hidden;
        white-space: pre;
      }
      .preview figcaption {
        margin-bottom: 6px;
        font:
          600 14px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      .preview pre {
        margin: 0;
        padding: 12px 14px;
        overflow-x: auto;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--code);
        font: inherit;
        tab-size: 4;
      }
      @media (max-width: 400px) {
        .preview pre {
          padding: 10px 11px;
        }
      }

      .folds {
        max-width: 44rem;
        margin-top: 36px;
      }
      details {
        border-top: 1px solid var(--rule);
      }
      details:last-child {
        border-bottom: 1px solid var(--rule);
      }
      summary {
        padding: 12px 0;
        cursor: pointer;
        font-weight: 600;
      }
      summary::marker {
        color: var(--muted);
      }
      summary:focus-visible {
        outline: 2px solid var(--pick);
        outline-offset: 2px;
        border-radius: 4px;
      }
      summary .count {
        margin-left: 6px;
        color: var(--muted);
        font-weight: 400;
      }
      details > ul,
      details > p {
        overflow-wrap: anywhere;
      }
      details > :last-child {
        padding-bottom: 14px;
      }
      details > ul {
        padding-left: 20px;
      }
      details li + li,
      details p + p {
        margin-top: 8px;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const page = document.getElementById('page')
        const holder = document.getElementById('compare-data')
        const raw = (holder ? holder.textContent : '').trim()
        const COLUMN_MIN_PX = 184
        const PRE_FRAME_PX = 30
        const PREVIEW_GAP_PX = 16

        function h(tag, props, ...kids) {
          const el = document.createElement(tag)
          for (const [name, value] of Object.entries(props || {})) {
            if (value === null || value === undefined || value === false) continue
            el.setAttribute(name, value === true ? '' : String(value))
          }
          for (const kid of kids.flat(Infinity)) {
            if (kid === null || kid === undefined || kid === false || kid === '') continue
            el.append(kid instanceof Node ? kid : String(kid))
          }
          return el
        }
        const text = v => (typeof v === 'string' ? v.trim() : typeof v === 'number' ? String(v) : '')
        const list = v => (Array.isArray(v) ? v : v === null || v === undefined || v === '' ? [] : [v])
        const keyOf = name => text(name).toLowerCase().replace(/\s+/g, ' ')
        const inline = s => s.split(/`([^`\n]+)`/).map((part, i) => (i % 2 === 1 ? h('code', null, part) : part))

        function fail(message) {
          page.replaceChildren(h('p', { class: 'problems' }, message))
        }
        if (!raw) return fail('This page has no comparison data. Add it as JSON after the last line of this file.')
        let data
        try {
          data = JSON.parse(raw)
        } catch (e) {
          return fail(`The comparison data is not valid JSON: ${e.message}`)
        }
        if (!data || typeof data !== 'object') return fail('The comparison data is not a JSON object.')

        const problems = []
        const measures = list(data.measures).filter(m => m && typeof m === 'object')
        const previews = list(data.previews).filter(p => p && typeof p === 'object')
        let choices = list(data.choices)
          .map(c => (typeof c === 'string' ? { name: c } : c && typeof c === 'object' ? c : {}))
          .map(c => ({ name: text(c.name), summary: text(c.summary) }))
          .filter(c => c.name)
        if (choices.length === 0) {
          problems.push('The data lists no choices.')
          const seen = new Map()
          for (const m of measures)
            for (const name of Object.keys(m.values || {})) if (!seen.has(keyOf(name))) seen.set(keyOf(name), name)
          choices = [...seen.values()].map(name => ({ name: text(name), summary: '' }))
        }
        const byKey = new Map(choices.map(c => [keyOf(c.name), c]))
        function choiceNamed(name, where) {
          const choice = byKey.get(keyOf(name))
          if (!choice && text(name)) problems.push(`“${text(name)}”, ${where}, is not one of the choices.`)
          return choice
        }

        const question = text(data.question)
        const pick = text(data.pick) ? choiceNamed(data.pick, 'the pick') : undefined
        const pickName = pick ? pick.name : text(data.pick)
        const before = text(data.pickBefore)
        const isSamePick = before && keyOf(before) === keyOf(pickName)
        const isPick = choice => keyOf(choice.name) === keyOf(pickName)
        document.title = question.replace(/`/g, '') || 'Comparison'

        const measureName = (m, i) => text(m.name) || `Measure ${i + 1}`
        const bestSets = measures.map((m, i) => {
          const where = `named as best on “${measureName(m, i)}”`
          return new Set(
            list(m.best)
              .map(name => choiceNamed(name, where))
              .filter(Boolean)
              .map(c => keyOf(c.name)),
          )
        })
        measures.forEach((m, i) => {
          for (const name of Object.keys(m.values || {})) choiceNamed(name, `named in the values of “${measureName(m, i)}”`)
        })
        previews.forEach((p, i) => {
          for (const name of Object.keys(p.texts || {})) choiceNamed(name, `named in the preview “${text(p.title) || i + 1}”`)
        })
        const judgedSets = bestSets.filter(s => s.size > 0)

        const tag = () => h('span', { class: 'tag' }, 'Pick')
        const better = m => text(m.better) && h('span', { class: 'better' }, ` (${text(m.better)})`)
        function tally(choice) {
          if (judgedSets.length === 0) return null
          const won = judgedSets.filter(s => s.has(keyOf(choice.name))).length
          return h('p', { class: 'tally' }, 'Best on ', h('b', null, won), ` of ${judgedSets.length} measures`)
        }
        function result(m, i, choice) {
          const entry = Object.entries(m.values || {}).find(([name]) => keyOf(name) === keyOf(choice.name))
          const raw = entry ? entry[1] : undefined
          const isObject = raw && typeof raw === 'object'
          const value = isObject ? text(raw.value) : text(raw)
          const note = isObject ? text(raw.note) : ''
          const isBest = bestSets[i].has(keyOf(choice.name))
          return [
            value
              ? h(
                  'p',
                  { class: isBest ? 'value is-best' : 'value' },
                  inline(value),
                  isBest && h('span', { class: 'best' }, 'Best'),
                )
              : h('p', { class: 'value is-empty' }, 'Not measured'),
            note && h('p', { class: 'note' }, inline(note)),
          ]
        }

        const verdict = h(
          'header',
          { class: 'verdict' },
          question && h('h1', { class: 'question' }, inline(question)),
          pickName ? h('p', { class: 'pick' }, pickName, tag()) : h('p', { class: 'pick is-missing' }, 'No pick'),
          before &&
            pickName &&
            h(
              'p',
              { class: 'change' },
              isSamePick ? 'Same pick as before the comparison.' : `Before the comparison, the pick was ${before}.`,
            ),
          text(data.reason) && h('p', { class: 'reason' }, inline(text(data.reason))),
          text(data.unexpected) && h('p', { class: 'odd' }, h('strong', null, 'Unexpected: '), inline(text(data.unexpected))),
        )

        const headRows = 3
        const stuckMark = h('div', { class: 'stuck-mark', style: 'grid-column: 1; grid-row: 1', 'aria-hidden': 'true' })
        const pickColumn = choices.findIndex(isPick) + 1
        const matrix = h(
          'section',
          {
            class: 'matrix',
            'aria-label': 'Choices',
            style: `grid-template-columns: repeat(${choices.length}, minmax(0, 1fr)); grid-template-rows: repeat(${headRows + 2 * measures.length}, auto)`,
          },
          pickColumn > 0 && h('div', { class: 'band', style: `grid-column: ${pickColumn}; grid-row: 1 / ${headRows + 1}` }),
          stuckMark,
          choices.map((choice, c) => [
            h(
              'h2',
              { class: isPick(choice) ? 'col-name is-pick' : 'col-name', style: `grid-column: ${c + 1}; grid-row: 1` },
              choice.name,
              isPick(choice) && tag(),
            ),
            h(
              'div',
              { class: 'col-summary', style: `grid-column: ${c + 1}; grid-row: 2` },
              choice.summary && h('p', { class: 'summary' }, inline(choice.summary)),
            ),
            h('div', { class: 'col-tally', style: `grid-column: ${c + 1}; grid-row: 3` }, tally(choice)),
          ]),
          measures.map((m, i) => [
            h(
              'h3',
              { class: 'm-head', style: `grid-column: 1 / -1; grid-row: ${headRows + 1 + 2 * i}` },
              inline(measureName(m, i)),
              better(m),
            ),
            choices.map((choice, c) =>
              h(
                'div',
                { class: 'cell', style: `grid-column: ${c + 1}; grid-row: ${headRows + 2 + 2 * i}` },
                h('span', { class: 'sr' }, `${choice.name}: `),
                result(m, i, choice),
              ),
            ),
          ]),
        )
        const columnsFit = h(
          'style',
          null,
          `@container page (min-width: ${choices.length * COLUMN_MIN_PX}px) {
            .matrix { display: grid; }
            .cards { display: none; }
          }`,
        )

        const cards = h(
          'section',
          { class: 'cards', 'aria-label': 'Choices' },
          choices.map(choice =>
            h(
              'article',
              { class: isPick(choice) ? 'card is-pick' : 'card' },
              h(
                'div',
                { class: 'card-head' },
                h('h2', null, choice.name, isPick(choice) && tag()),
                choice.summary && h('p', { class: 'summary' }, inline(choice.summary)),
                tally(choice),
              ),
              measures.map((m, i) =>
                h(
                  'div',
                  { class: 'row' },
                  h('p', { class: 'label' }, inline(measureName(m, i)), better(m)),
                  result(m, i, choice),
                ),
              ),
            ),
          ),
        )

        const probe = h('span', { class: 'mono-probe' }, '0'.repeat(100))
        document.body.append(probe)
        const monoCharPx = probe.getBoundingClientRect().width / 100
        probe.remove()
        const previewRowsFit = []
        const previewSection =
          previews.length > 0 &&
          h(
            'section',
            { class: 'previews', 'aria-label': 'Previews' },
            previews.map((p, i) => {
              const blocks = choices
                .map(choice => {
                  const entry = Object.entries(p.texts || {}).find(([name]) => keyOf(name) === keyOf(choice.name))
                  return entry && typeof entry[1] === 'string' ? { choice, body: entry[1].replace(/\s+$/, '') } : null
                })
                .filter(Boolean)
              const widest = Math.max(20, ...blocks.flatMap(b => b.body.split('\n').map(line => line.length)))
              const blockPx = Math.min(widest, 100) * monoCharPx + PRE_FRAME_PX
              const rowPx = Math.ceil(blocks.length * blockPx + (blocks.length - 1) * PREVIEW_GAP_PX)
              previewRowsFit.push(
                `@container page (min-width: ${rowPx}px) {
                  #preview-${i} .preview-grid { grid-template-columns: repeat(${blocks.length}, minmax(0, 1fr)); }
                }`,
              )
              return h(
                'div',
                { class: 'preview-group', id: `preview-${i}` },
                h('h2', null, inline(text(p.title) || 'Preview')),
                text(p.note) && h('p', null, inline(text(p.note))),
                h(
                  'div',
                  { class: 'preview-grid' },
                  blocks.map(b =>
                    h(
                      'figure',
                      { class: 'preview' },
                      h('figcaption', null, b.choice.name, isPick(b.choice) && tag()),
                      h('pre', null, b.body),
                    ),
                  ),
                ),
              )
            }),
          )

        const caveats = list(data.caveats).map(text).filter(Boolean)
        const method = list(data.method).map(text).filter(Boolean)
        const folds =
          (caveats.length > 0 || method.length > 0) &&
          h(
            'section',
            { class: 'folds' },
            caveats.length > 0 &&
              h(
                'details',
                null,
                h('summary', null, 'Caveats', h('span', { class: 'count' }, caveats.length)),
                h(
                  'ul',
                  null,
                  caveats.map(c => h('li', null, inline(c))),
                ),
              ),
            method.length > 0 &&
              h(
                'details',
                null,
                h('summary', null, 'How the choices were compared'),
                method.map(p => h('p', null, inline(p))),
              ),
          )

        const problemNote =
          problems.length > 0 &&
          h(
            'div',
            { class: 'problems', role: 'note' },
            h('p', null, 'Problems in the comparison data:'),
            h(
              'ul',
              null,
              problems.map(p => h('li', null, p)),
            ),
          )

        document.head.append(columnsFit, h('style', null, previewRowsFit.join('\n')))
        page.replaceChildren(verdict, problemNote || '', matrix, cards, previewSection || '', folds || '')
        new IntersectionObserver(([entry]) => {
          matrix.classList.toggle('is-stuck', !entry.isIntersecting && entry.boundingClientRect.top < 0)
        }).observe(stuckMark)
      })
    </script>
